# =====================================================================
#  ДОПИСАТЬ В КОНЕЦ СВОЕГО config.yaml от CLIProxyAPI
#  Не заменять файл целиком — потеряешь путь к OAuth-токенам Antigravity.
#  Отступы — ТОЛЬКО пробелы. Табы в YAML = ошибка парсинга.
# =====================================================================

# Задавливаем thinking у Gemini. Без этого модель жгёт ~800 reasoning-токенов
# на каждый батч из четырёх строк. Параметр reasoning_effort в теле запроса
# не работает — прокси лишь скрывает reasoning_content, а токены всё равно тратятся.
payload:
  override:
    - models:
        - name: "gemini-*"
          protocol: "antigravity"
      params:
        "generationConfig.thinkingConfig.thinkingLevel": "minimal"
  # Gemini 3.x отвергает запрос, если пришли и thinkingBudget, и thinkingLevel сразу.
  filter:
    - models:
        - name: "gemini-*"
          protocol: "antigravity"
      params:
        - "generationConfig.thinkingConfig.thinkingBudget"

# --- ЕСЛИ thinkingLevel НЕ СРАБОТАЛ -----------------------------------
# Замени блок выше на этот вариант (без filter):
#
# payload:
#   override:
#     - models:
#         - name: "gemini-*"
#           protocol: "antigravity"
#       params:
#         "generationConfig.thinkingConfig.thinkingBudget": 0
#
# Как проверить: в ответе на test.json смотри usage.
#   Хорошо:  prompt_tokens + completion_tokens == total_tokens, reasoning_tokens отсутствует
#   Плохо:   completion_tokens_details.reasoning_tokens больше 100
