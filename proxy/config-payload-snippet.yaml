# =====================================================================
# GlobalAutoTranslator -- фрагмент для config.yaml CLIProxyAPI
#
# Скопируй ВСЁ, что ниже (начиная с "payload:"), в КОНЕЦ своего config.yaml.
# Отступы в YAML значимы: "payload:" должен стоять без отступа,
# на том же уровне, что "port:" и "auth-dir:".
#
# Зачем: без этого Gemini тратит ~800 reasoning-токенов на каждый батч.
# Для перевода коротких строк размышления не нужны совсем.
#
# Проверка: proxy/test-batch.bat -> в usage должно быть
# prompt_tokens + completion_tokens == total_tokens и никакого reasoning_tokens.
# =====================================================================

payload:
  # override -- всегда перезаписывает значение, даже если клиент прислал своё.
  override:
    # Gemini через нативный протокол: бюджет размышлений в ноль.
    - models:
        - name: "gemini-*"
          protocol: "gemini"
        - name: "gemini-*"
          protocol: "antigravity"
      params:
        "generationConfig.thinkingConfig.thinkingBudget": 0
        "generationConfig.thinkingConfig.includeThoughts": false
        "generationConfig.temperature": 0

    # Тот же Gemini, но когда мод стучится через OpenAI-совместимый вход.
    - models:
        - name: "gemini-*"
          protocol: "openai"
      params:
        "reasoning_effort": "none"

  # filter -- вырезает параметры из запроса.
  # Некоторые сборки отвергают reasoning_effort в нативном Gemini-протоколе,
  # а мод шлёт его при включённой галке "Отправлять reasoning_effort=none".
  filter:
    - models:
        - name: "gemini-*"
          protocol: "gemini"
        - name: "gemini-*"
          protocol: "antigravity"
      params:
        - "reasoning_effort"
        - "thinking"
